# Free Render web services sleep after 15 minutes without visitors.
# This opens the health page every 10 minutes so the app stays awake
# (Render's free plan includes 750 hours a month - enough to run all month).
# Set the repository variable APP_URL if the Render address is different.
name: Keep the app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Open the health page
        run: curl -fsS --max-time 90 "${{ vars.APP_URL || 'https://studymatch-ai.onrender.com' }}/api/health" || echo "App not reachable yet"
