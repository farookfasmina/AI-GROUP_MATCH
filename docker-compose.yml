# Run the whole platform locally with PostgreSQL:  docker compose up --build
# Then open http://localhost:8000  (demo student: student@demo.lk / Demo@1234)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_platform
      POSTGRES_USER: studymatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymatch -d study_platform"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://studymatch:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/study_platform
      SECRET_KEY: ${SECRET_KEY:-change-me-local-only}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
      FRONTEND_URL: http://localhost:8000
      SEED_DEMO: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
