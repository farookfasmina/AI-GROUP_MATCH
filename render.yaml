# Render Blueprint: New + -> Blueprint -> pick this repository. Creates the web app and a free PostgreSQL database.
services:
  - type: web
    name: studymatch-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studymatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@studymatch.lk
      - key: ADMIN_PASSWORD
        sync: false        # Render asks for it when you create the Blueprint
      - key: SEED_DEMO
        value: "true"      # set to "false" before real data collection
      - key: FRONTEND_URL
        sync: false        # e.g. https://studymatch-ai.onrender.com (used in reset emails)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: studymatch-db
    plan: free
    databaseName: study_platform
